name: new_app
description: "Neev — Investment app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  fpdart: ^1.1.1
  dio: ^5.8.0+1
  pinput: ^5.0.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  fl_chart: ^0.70.2
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1

dependency_overrides:
  # 2.3.x pulls native `jni` and hits a CMake/ninja loop on this machine.
  path_provider_android: 2.2.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^3.2.3
  build_runner: ^2.7.1
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/branding/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0C4A41"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 21
